name: rule-tests

# 先紅再綠把關：規則庫與測試不一致的變更，在 PR 階段直接紅燈
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Python 相依套件
        run: python3 -m pip install -r requirements.txt

      - name: Python 單元測試
        run: python3 -m unittest discover tests

      - name: 引擎與規則庫自檢
        run: python3 tools/fire_code_calc.py self-test

      - name: 規則測試（先紅再綠，含覆蓋率檢查）
        run: python3 tools/fire_code_calc.py run-tests --strict

      - name: 實務註解庫一致性檢查
        run: python3 tools/practice_note_engine.py test --strict

      - name: 法規圖譜新鮮度把關（來源檔異動後未重建圖譜即紅燈）
        run: python3 tools/graph_status.py check

      - name: 示範案件門檻判斷煙霧測試
        run: python3 tools/fire_code_calc.py check-threshold --case "output/case.json"

      - name: 法典缺口偵測煙霧測試
        run: python3 tools/fire_code_calc.py check-gap --case "output/case.json"

      - name: 待確認規則清單煙霧測試
        run: python3 tools/verification_sheet.py list --format json

      - name: 核定表匯出煙霧測試
        run: |
          python3 tools/verification_sheet.py export --output /tmp/核定表-ci.html
          test -s /tmp/核定表-ci.html
