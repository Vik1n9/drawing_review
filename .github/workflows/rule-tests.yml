name: rule-tests

# 先紅再綠把關：規則庫與測試不一致的變更，在 PR 階段直接紅燈
on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Python 相依套件
        run: python3 -m pip install -r requirements.txt

      - name: Python 單元測試
        run: python3 -m unittest discover tests

      # 交付物1 對目標使用者的承諾是「零安裝也產得出來」。
      # 這一步刻意在裝套件之後、以移除 ezdxf 的方式驗證，
      # 否則承諾壞掉時 CI 不會有任何反應。
      - name: 零安裝承諾（移除 ezdxf 後仍須通過 DXF 解析與圖面標註測試）
        run: |
          python3 -m pip uninstall -y ezdxf
          python3 -m unittest tests.test_dxf_parse.DxfParseEncodingTest \
                              tests.test_dxf_parse.DxfParseDegradationTest \
                              tests.test_dxf_parse.DxfParseCliTest
          python3 -m pip install -r requirements.txt

      # 結束碼 2 ＝ EXIT_NEEDS_ACTION（要使用者用 CAD 匯出 DXF），不是失敗。
      # 倉庫內存在範例 DWG 是常態，這一步該驗的是「有給出引導」。
      - name: DWG 收件引導煙霧測試（無轉檔器亦須給出引導）
        run: python3 tools/dwg_guide.py check --path input --format json || test $? -eq 2

      - name: 零相依 DXF 解析煙霧測試
        run: python3 tools/dxf_parse.py --help

      # 範例圖是 R12＋Big5＋圖塊，真實案件的常見形態。
      # 這條鏈曾經只被人造 DXF 測過，退化了也沒人知道。
      - name: 真實範例圖解析煙霧測試
        run: python3 tools/dxf_parse.py --input "input/範例/楷得立消防設備圖說.dxf" --format json > /dev/null

      - name: 引擎與規則庫自檢
        run: python3 tools/fire_code_calc.py self-test

      - name: 規則測試（先紅再綠，含覆蓋率檢查）
        run: python3 tools/fire_code_calc.py run-tests --strict

      - name: 實務註解庫一致性檢查
        run: python3 tools/practice_note_engine.py test --strict

      - name: 實務註解語意抽取齊備檢查（有 active 註解未抽取即紅燈）
        run: python3 tools/practice_note_graph.py plan

      # 訓練圖譜是衍生產物、不進版控，所以 CI 從素材真的建一次——
      # review_corrections.md／stage_two_judgment_rules.md 的格式被改壞時，
      # 只驗 check 會因為「還沒建」而綠燈放過。
      - name: 訓練圖譜建置煙霧測試（markdown 筆記解析壞掉即紅燈）
        run: |
          python3 tools/training_graph_build.py build
          python3 tools/training_graph_build.py check

      # 重建只增不減是這套工具的核心承諾。verify 的紅燈類別包含
      # 「兩端都還在、邊卻不見了」——那種劣化使用者察覺不到，只能靠 CI 擋。
      - name: 法規圖譜重建驗收（節點消失／label 變動／邊流失即紅燈）
        run: python3 tools/regulation_graph_build.py verify

      - name: 兩個圖譜的新鮮度把關（來源檔異動後未更新即紅燈）
        run: python3 tools/graph_status.py check

      - name: 開場導引煙霧測試（結束碼 2 ＝ 有待處理步驟，非失敗）
        run: python3 tools/onboarding.py status --format json || test $? -eq 2

      - name: 操作簡介煙霧測試
        run: python3 tools/onboarding.py intro

      - name: 示範案件門檻判斷煙霧測試
        run: python3 tools/fire_code_calc.py check-threshold --case "tests/fixtures/case.json"

      - name: 法典缺口偵測煙霧測試
        run: python3 tools/fire_code_calc.py check-gap --case "tests/fixtures/case.json"

      - name: 待確認規則清單煙霧測試
        run: python3 tools/verification_sheet.py list --format json

      # 用 --all：不加時 export 只匯出「未核定」的規則，全部核定完畢就什麼都不寫，
      # 後面的 test -s 必紅。規則全綠是這套系統的目標狀態，不該讓 CI 反過來擋。
      - name: 核定表匯出煙霧測試
        run: |
          python3 tools/verification_sheet.py export --all --output /tmp/核定表-ci.html
          test -s /tmp/核定表-ci.html
